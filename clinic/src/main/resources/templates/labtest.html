    <div th:replace="base :: sidebar"></div>

    <div class="content">

        <table class="table table-bordered table-hover align-middle">
            <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Loại xét nghiệm</th>
                    <th>Đơn vị</th>
                    <th>Bình thường</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="t : ${labTests}">
                    <td th:text="${t.id}"></td>
                    <td th:text="${t.testName}"></td>
                    <td th:text="${t.unit}"></td>
                    <td th:text="${t.normalRange}"></td>
                    <td>
                        <button class="btn btn-warning btn-sm">Sửa</button>
                        <button class="btn btn-danger btn-sm"
                                th:onclick="'deleteTests(' + ${t.id} + ')'">
                            Xóa
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

    <div th:replace="base :: footer">

    </div>
