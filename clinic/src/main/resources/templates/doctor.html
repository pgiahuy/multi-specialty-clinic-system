

<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Quản lý Bác sĩ</title>

    <th:block th:replace="base :: css"></th:block>
    <th:block th:replace="base :: js"></th:block>
    <script th:src="@{/js/doctor.js}"></script>
</head>

<body>

    <div th:replace="base :: header('QUẢN LÝ BÁC SĨ')"></div>

    <div th:replace="base :: sidebar"></div>

    <div class="content">



        <table class="table table-bordered table-hover align-middle">
            <thead class="table-primary">
                <tr>
                    <th>Họ tên</th>
                    <th>Chuyên khoa</th>
                    <th>Giới tính</th>
                    
                    <th>Thông tin</th>
                    <th>Tài khoản</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="d : ${doctors}">
                    <td th:text="${d.fullName}"></td>
                    <td th:text="${d.idSpecailty.name}"></td>
                    <td th:text="${d.gender}"></td>
                    <td th:text="${d.description}"></td>
                    <td th:text="${d.user.username}"></td>
           
                    <td>
                        <button class="btn btn-warning btn-sm">Sửa</button>
                        <button class="btn btn-danger btn-sm"
                                th:onclick="'deleteDoctor(' + ${d.id} + ')'">
                            Xóa
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>
    
    <div class="d-flex justify-content-center mt-4">
        <div th:replace="~{fragments :: pagination('/admin/doctors', ${totalPages}, ${currentPage})}"></div>
    </div>

    <div th:replace="base :: footer"></div>
</body>
</html>
