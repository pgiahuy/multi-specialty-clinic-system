


<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Quản lý Ca làm việc</title>

    <th:block th:replace="base :: css"></th:block>
    <th:block th:replace="base :: js"></th:block>
    <script th:src="@{/js/admin-forms.js}"></script>
</head>

<body>

    <div th:replace="base :: header('QUẢN LÝ CA')"></div>

    <div th:replace="base :: sidebar"></div>

    <div class="content">



        <table class="table table-bordered table-hover align-middle">
            <thead class="table-primary">
                <tr>
                    <th>Bắt đầu</th>
                    <th>Kết thúc</th>
                    <th>Buổi</th>
                    <th>Bệnh nhân tối đa</th>
                    <th>Bệnh nhân tối thiểu</th>
             
                    <th></th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="d : ${shifts}">
                    <td th:text="${#temporals.format(d.startTime, 'HH:mm')}"></td>
                    <td th:text="${#temporals.format(d.endTime, 'HH:mm')}"></td>
                    <td th:text="${d.session}"></td>
                    <td th:text="${d.maxPatients}"></td>
                    <td th:text="${d.minPatients}"></td>
   
           
                    <td>
                        <button class="btn btn-warning btn-sm">Sửa</button>
                        <button class="btn btn-danger btn-sm"
                                th:onclick="'deleteDoctor(' + ${d.id} + ')'">
                            Xóa
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

    <div class="d-flex justify-content-center mt-4">
        <div th:replace="~{fragments :: pagination('/admin/shifts', ${totalPages}, ${currentPage})}"></div>
    </div>

    <div th:replace="base :: footer">

    </div>
</body>
</html>
