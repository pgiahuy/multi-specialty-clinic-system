<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head>
        <title>Admin</title>

    <th:block th:fragment="js">

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </th:block>

    <th:block th:fragment="css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

        <link th:href="@{/css/styles.css}" rel="stylesheet">
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Dancing+Script:wght@400..700&family=Dosis:wght@200..800&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    </th:block>

</head>

<body>

    <header th:fragment="header(title)">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">

            <span class="navbar-brand mb-0 h5 text-white"
                  th:text="${title}">Default</span>

            <div class="ms-auto me-3" sec:authorize="isAuthenticated()">
                <span class="text-white me-3">Admin</span>
                <a class="btn btn-sm btn-danger" th:href="@{/logout}">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </a>
            </div>

        </div>
    </nav>
</header>

    <div th:fragment="sidebar" class="bg-dark text-white sidebar p-3">
        <h4 class="text-center">Danh mục</h4>
        <hr>

        <ul class="nav flex-column">

            <li class="nav-item">
                <a class="nav-link text-white" th:href="@{/}">
                    <i class="bi bi-house me-2"></i>Trang chủ
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" th:href="@{/admin/users}"><i class="bi bi-person-fill me-2"></i>Tài khoản</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" th:href="@{/admin/medicines}"><i class="bi bi-capsule me-2"></i>Dược phẩm</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" th:href="@{/admin/medical-records}" ><i class="bi bi-clipboard2-pulse-fill me-2"></i></i>Bệnh án</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" th:href="@{/admin/appointments}"><i class="bi bi-calendar2-check me-2"></i>Lịch hẹn</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" th:href="@{/admin/areas}"><i class="bi bi-calendar2-check me-2"></i>Khu vực khám</a>
            </li>
            
            <li class="nav-item">
                <a class="nav-link text-white" th:href="@{/admin/rooms}"><i class="bi bi-calendar2-check me-2"></i>Phòng khám</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" th:href="@{/admin/lab-tests}"><i class="bi bi-flask"></i></i>Xét nghiệm</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" th:href="@{/admin/specialties}">Chuyên khoa</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" th:href="@{/admin/shifts}">Ca khám</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" th:href="@{/admin/doctors}">Bác sĩ</a>
            </li>
            
            <li class="nav-item">
                <a class="nav-link text-white" th:href="@{/admin/schedules}">Lịch bác sĩ</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" th:href="@{/admin/patients}">Bệnh nhân</a>
            </li>




        </ul>
    </div>
    

    <footer th:fragment="footer">
        <div class="text-center p-3 bg-light mt-4">
            © 2026 Admin System
        </div>
    </footer>

</body>
</html>
