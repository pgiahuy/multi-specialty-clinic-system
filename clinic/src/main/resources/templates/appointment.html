<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Quản lý lịch hẹn</title>

    <th:block th:replace="base :: css"></th:block>
    <th:block th:replace="base :: js"></th:block>
    <script th:src="@{/js/user.js}"></script>
</head>

<body>

    <div th:replace="base :: header('QUẢN LÝ LỊCH HẸN')"></div>

    <div th:replace="base :: sidebar"></div>

    <div class="content">

        <div class="mb-3">
            <form class="d-flex" method="get" th:action="@{/admin/appointments}">
                <input type="text" name="kw" th:value="${kw}" class="form-control me-2"
                    placeholder="Tìm theo tên bệnh nhân hoặc bác sĩ..." />
                <div class="col-md-4">
                    <button type="submit" class="btn btn-outline-primary">Tìm kiếm</button>
                    <a th:href="@{/admin/appointments}" class="btn btn-outline-secondary ms-2">Đặt lại</a>
                </div>
            </form>
        </div>

        <table class="table table-bordered table-hover align-middle">
            <thead class="table-primary">
                <tr>
                    <th>Bác sĩ</th>
                    <th>Bệnh nhân</th>
                    <th>Ngày</th>
                    <th>Giờ</th>
                    <th>Trạng thái</th>
                    <th>Ngày tạo</th>
                    <th>Hành động</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="a : ${appointments}">

                    <td th:text="${a.doctorId.fullName}"></td>
                    <td th:text="${a.patientId.fullName}"></td>

                    <td th:text="${a.date}"></td>
                    <td th:text="${a.timeSlot}"></td>
                    <td th:text="${a.status}"></td>
                    <td th:text="${a.createdAt}"></td>
                    <td>
                        <button class="btn btn-warning btn-sm">Sửa</button>

                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(appointments)}">
                    <td colspan="7" class="text-center text-muted p-4">Không tìm thấy lịch hẹn nào trong hệ thống.
                    </td>
            </tbody>
        </table>

    </div>

    <div class="d-flex justify-content-center mt-4">
        <div
            th:replace="~{fragments :: pagination(${kw} != null ? '/admin/appointments?kw=' + ${kw} : '/admin/appointments', ${totalPages}, ${currentPage})}">
        </div>
    </div>

    <div th:replace="base :: footer">

    </div>
</body>

</html>
