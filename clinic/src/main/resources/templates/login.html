<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Đăng nhập</title>
    <th:block th:replace="base :: css"></th:block>
</head>
<body>

    <div class="container-fluid vh-100 d-flex justify-content-center align-items-center" style="background-color: #f5f7fa;">
        <div class="card shadow-sm border-0" style="width: 100%; max-width: 420px; border-radius: 10px;">
            <div class="card-header bg-dark text-white text-center py-3" style="border-radius: 10px 10px 0 0;">
                <h4 class="mb-0 fw-bold">ĐĂNG NHẬP</h4>
            </div>
            <div class="card-body p-4">
                <form method="post" th:action="@{/login}">
                    <div class="mb-3">
                        <label for="username" class="form-label small fw-bold text-secondary">Tên đăng nhập</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" value="admin" class="form-control bg-light border-start-0" id="username" placeholder="Nhập tên đăng nhập" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label small fw-bold text-secondary">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" value="Abc1234@" class="form-control bg-light border-start-0" id="password" placeholder="Nhập mật khẩu" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-2 fw-bold" style="background-color: #212529;">
                        ĐĂNG NHẬP
                    </button>
                </form>
            </div>

        </div>
    </div>


    <div th:replace="base :: footer"></div>
</body>
</html>
