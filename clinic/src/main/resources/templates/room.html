<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Quản lý Phòng</title>
    <th:block th:replace="~{base :: css}"></th:block>
    <th:block th:replace="~{base :: js}"></th:block>
    <script th:inline="javascript">
        window.__OPEN_ROOM_FORM__ = /*[[${openForm != null ? openForm : false}]]*/ false;
    </script>
    <script th:src="@{/js/admin-crud.js}"></script>
</head>

<body>
    <div th:replace="~{base :: header('QUẢN LÝ PHÒNG')}"></div>
    <div th:replace="~{base :: sidebar}"></div>

    <div class="content mt-6">
        <th:block th:with="hasError=${errorMsg}, hasSuccess=${successMsg}">
            <div th:if="${hasError}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
                <span th:text="${errorMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${hasSuccess}" class="alert alert-success alert-dismissible fade show mb-3" role="alert">
                <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </th:block>

        <div class="d-flex justify-content-end mb-3">
            <button type="button" id="toggleRoomFormBtn" class="btn btn-success"
                onclick="toggleCrudForm('roomForm', 'toggleRoomFormBtn')">
                <i class="bi bi-plus-circle me-2"></i>Thêm phòng
            </button>
        </div>

        <form class="row g-2 mb-3" method="get" action="" id="roomFilterForm">
            <div class="col-md-4">
                <input type="text" name="roomNumber" class="form-control" placeholder="Tìm phòng"
                    th:value="${param.roomNumber != null ? param.roomNumber : ''}" />
            </div>
            <div class="col-md-4">
                <input type="text" name="areaName" class="form-control" placeholder="Tìm theo khu vực"
                    th:value="${param.areaName != null ? param.areaName : ''}" />
            </div>
            <div class="col-md-4">
                <button type="submit" class="btn btn-outline-primary">Tìm kiếm</button>
                <a th:href="@{/admin/rooms}" class="btn btn-outline-secondary ms-2">Đặt lại</a>
            </div>
        </form>

        <form id="roomForm" th:class="${openForm} ? 'card p-4 mb-4' : 'card p-4 mb-4 d-none'" method="post"
            th:object="${roomForm}" th:action="@{/admin/rooms}">
            <h4 id="formTitle" class="mb-3 text-uppercase fw-bold text-primary">Thêm / Cập nhật phòng</h4>
            <input type="hidden" th:field="*{id}" id="roomId" />

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Số phòng / Tên:</label>
                    <input type="text" th:field="*{roomNumber}" class="form-control" id="roomNumber" required />
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label fw-bold">Khu vực:</label>
                    <select th:field="*{area.id}" class="form-select" id="areaId">
                        <option value="">-- Chọn khu vực --</option>
                        <option th:each="a : ${areas}" th:value="${a.id}" th:text="${a.areaName}"></option>
                    </select>
                </div>
            </div>

            <div class="d-flex gap-2 justify-content-end">
                <button type="button" class="btn btn-secondary"
                    onclick="toggleCrudForm('roomForm', 'toggleRoomFormBtn')">Hủy</button>
                <button type="submit" id="submitFormBtn" class="btn btn-primary">Lưu thông tin</button>
            </div>
        </form>

        <table class="table table-bordered table-hover align-middle shadow-sm">
            <thead class="table-primary text-center">
                <tr>
                    <th>Phòng</th>
                    <th>Khu vực</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${rooms}" th:id="'room-row-' + ${r.id}">
                    <td th:text="${r.roomNumber}" th:id="'r-name-' + ${r.id}"></td>
                    <td th:text="${r.areaId != null ? r.areaId.areaName : ''}"
                        th:attr="data-area-id=${r.areaId != null ? r.areaId.id : ''}" th:id="'area-name-' + ${r.id}">
                    </td>
                    <td class="text-center">

                        <button class="btn btn-warning btn-sm me-1" th:onclick="|editRoom(${r.id})|">
                            <i class="bi bi-pencil-square"></i> Sửa
                        </button>
                        <button class="btn btn-danger btn-sm" th:data-id="${r.id}" th:data-url="@{/admin/rooms/}"
                            th:data-row-prefix="'room-row-'"
                            onclick="deleteCrudItem(this.dataset.id, this.dataset.url, this.dataset.rowPrefix)">
                            <i class="bi bi-trash"></i> Xóa
                        </button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(rooms)}">
                    <td colspan="3" class="text-center text-muted p-4">Không tìm thấy phòng nào trong hệ thống.
                    </td>
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-center mt-1">
        <div th:replace="~{fragments :: pagination('/admin/rooms', ${totalPages}, ${currentPage})}"></div>
    </div>

    <div th:replace="~{base :: footer}"></div>

    <script th:inline="javascript">
        initFormState(window.__OPEN_ROOM_FORM__, 'roomForm', 'toggleRoomFormBtn');

        function editRoom(id) {
            document.getElementById('roomId').value = id;
            document.getElementById('roomNumber').value = document.getElementById('r-name-' + id).innerText.trim();
            document.getElementById('areaId').value = document.getElementById('area-name-' + id).dataset.areaId || '';
            document.getElementById('formTitle').innerText = 'Cập nhật phòng (ID: ' + id + ')';
            document.getElementById('submitFormBtn').innerText = 'Lưu thay đổi';
            document.getElementById('roomForm').classList.remove('d-none');
            document.getElementById('toggleRoomFormBtn').className = 'btn btn-secondary';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>

</html>
