    <div th:replace="base :: header"></div>

    <div th:replace="base :: sidebar"></div>

    <div class="content">

        <h2 class="mb-4">Bệnh nhân</h2>

        <table class="table table-bordered table-hover align-middle">
            <thead class="table-primary">
                <tr>
                    <th>Họ tên</th>
                    <th>CCCD</th>
                    <th>SĐT</th>
                    <th>Giới tính</th>
                    <th>Ngày sinh</th>
                    <th>Địa chỉ</th>
                    <th>Tài khoản</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="d : ${patients}">
                    <td th:text="${d.fullName}"></td>
                    <td th:text="${d.cccd}"></td>
                    <td th:text="${d.phone}"></td>
                    <td th:text="${d.gender}"></td>
                    <td th:text="${d.dob}"></td>
                    <td th:text="${d.address}"></td>
                    <td th:text="${d.user.username}"></td>
           
                    <td>
                        <button class="btn btn-warning btn-sm">Sửa</button>
                        <button class="btn btn-danger btn-sm"
                                th:onclick="'deleteDoctor(' + ${d.id} + ')'">
                            Xóa
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

    <div th:replace="base :: footer">

    </div>
