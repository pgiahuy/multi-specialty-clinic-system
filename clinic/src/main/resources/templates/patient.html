


<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Quản lý Bệnh nhân</title>

    <th:block th:replace="base :: css"></th:block>
    <th:block th:replace="base :: js"></th:block>
    <script th:src="@{/js/admin-forms.js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        initAdminForm('userForm', {
            toggleBtnId: 'toggleUserFormBtn',
            submitBtnId: 'submitFormBtn',
            passwordGroupId: 'passwordGroup',
            idField: 'userId',
            fields: ['username','email','password','avatar'],
            tableFieldMap: {'username':'name-','email':'email-'},
            open: /*[[${openForm}]]*/ false,
            serverData: /*[[${user}]]*/ {}
        });

        function toggleUserForm() {
            var f = document.getElementById('userForm');
            if (!f) return;
            if (f.classList.contains('d-none')) openForCreate_userForm(); else resetAndClose_userForm();
        }

        function resetAndCloseForm() { resetAndClose_userForm(); }
        /*]]>*/
    </script>
</head>

<body>

    <div th:replace="base :: header('QUẢN LÝ BỆNH NHÂN')"></div>

    <div th:replace="base :: sidebar"></div>

    <div class="content">
        
         <th:block th:with="hasError=${errorMsg}, hasSuccess=${successMsg}">
            <div th:if="${hasError}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span th:text="${errorMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${hasSuccess}" class="alert alert-success alert-dismissible fade show mb-3" role="alert">
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </th:block>
        
<!--        <div class="d-flex justify-content-end mb-3">
            <button type="button" id="toggleUserFormBtn" class="btn btn-success" onclick="toggleUserForm()">
                <i class="bi bi-plus-circle me-2"></i>Thêm bệnh nhân
            </button>
        </div>

              th:object="${user}" th:action="@{/admin/users}" enctype="multipart/form-data">

        <table class="table table-bordered table-hover align-middle">
            <thead class="table-primary">
                <tr>
                    <th>Họ tên</th>
                    <th>CCCD</th>
                    <th>SĐT</th>
                    <th>Giới tính</th>
                    <th>Ngày sinh</th>
                    <th>Địa chỉ</th>
                    <th>Tài khoản</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="d : ${patients}">
                    <td th:text="${d.fullName}"></td>
                    <td th:text="${d.cccd}"></td>
                    <td th:text="${d.phone}"></td>
                    <td th:text="${d.gender}"></td>
                    <td th:text="${d.dob}"></td>
                    <td th:text="${d.address}"></td>
                    <td th:text="${d.userId.username}"></td>
           
                    <td>
                        <button class="btn btn-warning btn-sm">Sửa</button>
                        <button class="btn btn-danger btn-sm"
                                th:onclick="'deleteDoctor(' + ${d.id} + ')'">
                            Xóa
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

    <div class="d-flex justify-content-center mt-4">
        <div th:replace="~{fragments :: pagination('/admin/patients', ${totalPages}, ${currentPage})}"></div>
    </div>

    <div th:replace="base :: footer">

    </div>
</body>
</html>
