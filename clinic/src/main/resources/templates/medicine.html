<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Quản lý Thuốc</title>
    <th:block th:replace="~{base :: css}"></th:block>
    <th:block th:replace="~{base :: js}"></th:block>
    <script th:inline="javascript">
        window.__OPEN_MEDICINE_FORM__ = /*[[${openForm != null ? openForm : false}]]*/ false;
    </script>
    <script th:src="@{/js/admin-crud.js}"></script>
</head>

<body>
    <div th:replace="~{base :: header('QUẢN LÝ THUỐC')}"></div>
    <div th:replace="~{base :: sidebar}"></div>

    <div class="content mt-6">
        <th:block th:with="hasError=${errorMsg}, hasSuccess=${successMsg}">
            <div th:if="${hasError}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
                <span th:text="${errorMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${hasSuccess}" class="alert alert-success alert-dismissible fade show mb-3" role="alert">
                <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </th:block>

        <div class="d-flex justify-content-end mb-3">
            <button type="button" id="toggleMedicineFormBtn" class="btn btn-success"
                onclick="toggleCrudForm('medicineForm', 'toggleMedicineFormBtn')">
                <i class="bi bi-plus-circle me-2"></i>Thêm thuốc mới
            </button>
        </div>

        <form id="medicineForm" th:class="${openForm} ? 'card p-4 mb-4' : 'card p-4 mb-4 d-none'" method="post"
            th:object="${medicineForm}" th:action="@{/admin/medicines}" enctype="multipart/form-data">
            <h4 id="formTitle" class="mb-3 text-uppercase fw-bold text-primary">Thêm / Cập nhật thuốc</h4>
            <input type="hidden" th:field="*{id}" id="medicineId" />

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Mã thuốc:</label>
                    <input type="text" th:field="*{code}" class="form-control" id="medicineCode" required />
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Tên thuốc:</label>
                    <input type="text" th:field="*{name}" class="form-control" id="medicineName" required />
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-bold">Giá:</label>
                    <input type="number" step="0.01" min="0" th:field="*{price}" class="form-control" id="medicinePrice"
                        required />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-bold">Đơn vị:</label>
                    <input type="text" th:field="*{unit}" class="form-control" id="medicineUnit" required />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-bold">Mức cảnh báo tồn kho:</label>
                    <input type="number" min="0" th:field="*{minStockAlert}" class="form-control"
                        id="medicineMinStockAlert" />
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Ảnh thuốc:</label>
                <input type="file" name="image" class="form-control" id="medicineImage" accept="image/*" />
                <div class="form-text">Để trống nếu giữ nguyên ảnh cũ.</div>
            </div>

            <div class="d-flex gap-2 justify-content-end">
                <button type="button" class="btn btn-secondary"
                    onclick="toggleCrudForm('medicineForm', 'toggleMedicineFormBtn')">Hủy</button>
                <button type="submit" id="submitFormBtn" class="btn btn-primary">Lưu thông tin</button>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle shadow-sm">
                <thead class="table-primary text-center">
                    <tr>
                        <th style="width: 12%">Mã thuốc</th>
                        <th>Tên thuốc</th>
                        <th style="width: 15%">Giá bán</th>
                        <th style="width: 10%">Đơn vị</th>
                        <th style="width: 15%">Mức cảnh báo</th>
                        <th style="width: 12%">Hình ảnh</th>
                        <th style="width: 18%">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${medicines}" th:id="'med-row-' + ${m.id}">
                        <td th:id="'med-code-' + ${m.id}" th:text="${m.code}"
                            class="text-center fw-bold text-secondary"></td>
                        <td th:id="'med-name-' + ${m.id}" th:text="${m.name}"></td>
                        <td th:id="'med-price-' + ${m.id}"
                            th:text="${#numbers.formatDecimal(m.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"
                            class="text-end fw-bold text-danger"></td>
                        <td th:id="'med-unit-' + ${m.id}" th:text="${m.unit}" class="text-center"></td>
                        <td class="text-center">
                            <span th:text="${m.minStockAlert != null ? m.minStockAlert : 'Không đặt'}"></span>
                            <input type="hidden" th:id="'med-min-' + ${m.id}" th:value="${m.minStockAlert}" />
                        </td>
                        <td class="text-center">
                            <img th:src="${m.secureUrl != null ? m.secureUrl : '/images/default-medicine.png'}"
                                alt="medicine image" class="img-thumbnail object-fit-cover" width="60" height="60" />
                            <input type="hidden" th:id="'med-image-' + ${m.id}" th:value="${m.secureUrl}" />
                        </td>
                        <td class="text-center">
                            <button class="btn btn-warning btn-sm me-1"
                                th:attr="data-id=${m.id}, data-code=${m.code}, data-name=${m.name}, data-price=${m.price}, data-unit=${m.unit}, data-min=${m.minStockAlert}"
                                onclick="editMedicine(this)">
                                <i class="bi bi-pencil-square"></i> Sửa
                            </button>
                            <button class="btn btn-danger btn-sm"
                                th:onclick="|deleteCrudItem(${m.id}, '/admin/medicines/', 'med-row-')|">
                                <i class="bi bi-trash-fill"></i> Xóa
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(medicines)}">
                        <td colspan="7" class="text-center text-muted p-4">Không tìm thấy loại thuốc nào trong hệ thống.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-flex justify-content-center mt-1">
        <div th:replace="~{fragments :: pagination('/admin/medicines', ${totalPages}, ${currentPage})}"></div>
    </div>

    <div th:replace="~{base :: footer}"></div>

    <script th:inline="javascript">
        initFormState(window.__OPEN_MEDICINE_FORM__, 'medicineForm', 'toggleMedicineFormBtn');

        function editMedicine(button) {
            const id = button.getAttribute('data-id');
            const code = button.getAttribute('data-code') || '';
            const name = button.getAttribute('data-name') || '';
            const price = button.getAttribute('data-price') || '';
            const unit = button.getAttribute('data-unit') || '';
            const minStockAlert = button.getAttribute('data-min') || '';

            document.getElementById('medicineId').value = id;
            document.getElementById('medicineCode').value = code;
            document.getElementById('medicineName').value = name;
            document.getElementById('medicinePrice').value = price;
            document.getElementById('medicineUnit').value = unit;
            document.getElementById('medicineMinStockAlert').value = minStockAlert === 'null' ? '' : minStockAlert;

            document.getElementById('formTitle').innerText = 'Cập nhật thuốc (ID: ' + id + ')';
            document.getElementById('submitFormBtn').innerText = 'Lưu thay đổi';

            const form = document.getElementById('medicineForm');
            const toggleBtn = document.getElementById('toggleMedicineFormBtn');
            form.classList.remove('d-none');
            toggleBtn.innerHTML = '<i class="bi bi-dash-circle me-2"></i>Đóng form';
            toggleBtn.className = 'btn btn-secondary';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>

</html>
