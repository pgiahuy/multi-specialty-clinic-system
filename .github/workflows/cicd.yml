name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  backend-pipeline:
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://triplehstorage.site

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Inject Firebase Service Account Key
        run: |
          echo '${{ secrets.FIREBASE_KEY }}' > clinic/src/main/resources/serviceAccountKey.json

      - name: Build Backend with Maven System
        run: |
          cd clinic
          mvn clean package -DskipTests -Dmaven.javadoc.skip=true

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./clinic
          file: ./clinic/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/clinic-backend:latest

      - name: Install Cloudflare Client
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Configure SSH Tunnel Client
        run: |
          mkdir -p ~/.ssh
          echo -e "Host myserver\n\tHostName ${{ secrets.SERVER_HOST }}\n\tUser ${{ secrets.SERVER_USER }}\n\tProxyCommand cloudflared access ssh --hostname %h" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy Backend and Database to Server via SSH
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass

          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no myserver "mkdir -p /home/giahuy/mysql_init"
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" scp -o StrictHostKeyChecking=no clinic/db/init.sql myserver:/home/giahuy/mysql_init/init.sql

          SSHPASS="${{ secrets.SERVER_PASSWORD }}" sshpass -e ssh -o StrictHostKeyChecking=no myserver << 'EOF'
          docker rm -f clinic-mysql || true

          echo "$SSHPASS" | sudo -S rm -rf /home/giahuy/mysql_data
          mkdir -p /home/giahuy/mysql_data

          docker run -d \
            --network="host" \
            --name=clinic-mysql \
            --restart=always \
            -v /home/giahuy/mysql_data:/var/lib/mysql \
            -e MYSQL_ROOT_PASSWORD="root" \
            mysql:8.0

          for i in {1..15}; do
            if docker exec clinic-mysql mysqladmin ping -u root -proot --silent; then
              break
            fi
            sleep 2
          done

          docker exec -i clinic-mysql mysql -u root -proot --host=127.0.0.1 -e "DROP DATABASE IF EXISTS clinicdb; CREATE DATABASE clinicdb;"
          docker exec -i clinic-mysql mysql -u root -proot --host=127.0.0.1 clinicdb < /home/giahuy/mysql_init/init.sql

          docker pull ${{ secrets.DOCKER_USERNAME }}/clinic-backend:latest
          docker rm -f my-clinic-tomcat || true

          docker run -d \
            --network="host" \
            --name=my-clinic-tomcat \
            -e DB_PASSWORD="root" \
            --restart=always \
            ${{ secrets.DOCKER_USERNAME }}/clinic-backend:latest

          docker image prune -f
          echo "BACKEND DONE"
          EOF

  frontend-pipeline:
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://triplehstorage.site

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: "./client/package-lock.json"

      - name: Install dependencies and Build React
        run: |
          cd client
          npm install
          CI=false npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/clinic-frontend:latest

      - name: Install Cloudflare Client
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Configure SSH Tunnel Client
        run: |
          mkdir -p ~/.ssh
          echo -e "Host myserver\n\tHostName ${{ secrets.SERVER_HOST }}\n\tUser ${{ secrets.SERVER_USER }}\n\tProxyCommand cloudflared access ssh --hostname %h" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy Frontend to Server via Native SSH
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no myserver << 'EOF'
          docker pull ${{ secrets.DOCKER_USERNAME }}/clinic-frontend:latest
          docker rm -f my-clinic-frontend || true
          docker run -d --network="host" --name=my-clinic-frontend --restart=always ${{ secrets.DOCKER_USERNAME }}/clinic-frontend:latest
          docker image prune -f
          echo "FRONTEND DONE"
          EOF
