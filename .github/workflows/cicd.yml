name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  backend-pipeline:
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.modified, 'clinic/')

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build Backend with Maven
        run: |
          cd clinic
          mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./clinic
          file: ./clinic/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/clinic-backend:latest

      - name: Install Cloudflare Client
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Deploy Backend to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          proxy_command: cloudflared access ssh --hostname %h
          script: |
            echo "1. Kéo Docker Image Backend mới về..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/clinic-backend:latest
            echo "2. Xóa Container Backend cũ..."
            docker rm -f my-clinic-tomcat || true
            echo "3. Chạy Container Backend mới..."
            docker run -d --network="host" --name=my-clinic-tomcat --restart=always ${{ secrets.DOCKER_USERNAME }}/clinic-backend:latest
            docker image prune -f
            echo "BACKEND ĐÃ CẬP NHẬT TỰ ĐỘNG!"

  frontend-pipeline:
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.modified, 'client/')

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies and Build React
        run: |
          cd client
          npm install
          npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/clinic-frontend:latest

      - name: Install Cloudflare Client
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Deploy Frontend to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          proxy_command: cloudflared access ssh --hostname %h
          script: |
            echo "1. Kéo Docker Image Frontend mới về..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/clinic-frontend:latest
            echo "2. Xóa Container Frontend Nginx cũ..."
            docker rm -f my-clinic-frontend || true
            echo "3. Chạy Container Frontend mới (Chạy cổng 80 hoặc cổng bạn muốn)..."
            docker run -d -p 80:80 --name=my-clinic-frontend --restart=always ${{ secrets.DOCKER_USERNAME }}/clinic-frontend:latest
            docker image prune -f
            echo "FRONTEND REACT ĐÃ CẬP NHẬT TỰ ĐỘNG!"
